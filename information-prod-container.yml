server:
  port: 8072
  servlet:
    context-path: /information
  shutdown: graceful
spring:
  application:
    name: information
  datasource:
    url: jdbc:mysql://host.docker.internal:3306/schools_info
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: host.docker.internal:9092
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 20000
            logger-level: basic
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
    instances:
      detailsForCustomerSupportApp:
        minimumNumberOfCalls: 2
        failureRateThreshold: 50
        waitDurationInOpenState: 30000ms
        permittedNumberOfCallsInHalfOpenState: 2
  retry:
    configs:
      default: {}
    instances:
      retryForCustomerDetails:
        waitDuration: 2000ms
        max-attempts: 3
  ratelimiter:
    configs:
      default:
        registerHealthIndicator: true
    instances:
      status:
        timeoutDuration: 5000ms
        limitRefreshPeriod: 5000ms
        limitForPeriod: 1
services:
  security:
    url: http://security:8075/
  finance:
    url: http://finance:8074/
eureka:
  client:
    enabled: true
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://eureka:8071/eureka/
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
jwt:
  secret: ${JWT_SECRET}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 0.1
    export:
      enabled: true
      zipkin:
        enabled: true
        endpoint: http://zipkin:9411/api/v2/spans
        connect-timeout: 1s
        read-timeout: 5s
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
logging:
  level:
    com.theschools.information: INFO
