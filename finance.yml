server:
  port: 8074
  servlet:
    context-path: /finance
spring:
  application:
    name: finance
  main:
    allow-bean-definition-overriding: true
  flyway:
    baseline-on-migrate: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
management:
  endpoints:
    web:
      exposure:
        include: "*"
jwt:
  secret: secret
