spring:
  application:
    name: security
  datasource:
    url: jdbc:mysql://host.docker.internal:3306/schools_security
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    baseline-on-migrate: true
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 20000
            logger-level: basic
services:
  information:
    url: http://information:8072/
eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://eureka:8071/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
logging:
  level:
    com.theschools.security: INFO
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 0.1
    export:
      enabled: true
      zipkin:
        enabled: true
        endpoint: http://zipkin:9411/api/v2/spans
        connect-timeout: 1s
        read-timeout: 5s
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
server:
  port: 8075
  servlet:
    context-path: /security
  shutdown: graceful
