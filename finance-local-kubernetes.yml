server:
  shutdown: graceful
spring:
  datasource:
    url: jdbc:mysql://88.222.242.187:3306/schools_finance
    username: root
    password: ${DB_PASSWORD}
  kafka:
    bootstrap-servers: 88.222.242.187:9092
eureka:
  client:
    enabled: true
    service-Url:
      defaultZone: http://88.222.242.187:30771/eureka/
    fetchRegistry: true
    registerWithEureka: true
  instance:
    preferIpAddress: true
    leaseRenewalIntervalInSeconds: 10
    leaseExpirationDurationInSeconds: 30
services:
  information:
    url: http://88.222.242.187:30772/
management:
  tracing:
    export:
      enabled: false
      zipkin:
        enabled: false
        endpoint: http://88.222.242.187:30711/api/v2/spans
