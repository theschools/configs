server:
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: '*'
  tracing:
    export:
      enabled: true
      zipkin:
        enabled: true
        endpoint: http://zipkin-container:9411/api/v2/spans
spring: {}
eureka:
  client:
    enabled: true
    service-Url:
      defaultZone: http://88.222.242.187:30771/eureka/
    fetchRegistry: true
    registerWithEureka: true
  instance:
    preferIpAddress: true
    leaseRenewalIntervalInSeconds: 10
    leaseExpirationDurationInSeconds: 30
logging:
  level:
    com:
      theschools:
        gateway: DEBUG
