server:
  port: 8070
spring:
  application:
    name: gateway
  main:
    allow-bean-definition-overriding: true
management:
  endpoints:
    web:
      exposure:
        include: '*'
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8071/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    preferIpaddress: true
logging:
  level:
    com:
      theschools:
        gateway: DEBUG
