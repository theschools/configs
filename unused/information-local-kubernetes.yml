server:
  shutdown: graceful
spring:
  datasource:
    url: jdbc:mysql://88.222.242.187:3306/schools_info
    username: root
    password: ${DB_PASSWORD}
  flyway:
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: 88.222.242.187:9092
  jpa:
    show-sql: true
services:
  security:
    url: http://88.222.242.187:30775/
  finance:
    url: http://88.222.242.187:30774/
eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://88.222.242.187:30771/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    preferIpaddress: true
    leaseRenewalIntervalInSeconds: 10
    leaseExpirationDurationInSeconds: 30
jwt:
  secret: ${JWT_SECRET}
management:
  endpoints:
    web:
      exposure:
        include: '*'
  tracing:
    export:
      enabled: false
      zipkin:
        enabled: false
        endpoint: http://88.222.242.187:30711/api/v2/spans
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
    instances:
      detailsForCustomerSupportApp:
        minimumNumberOfCalls: 2
        failureRateThreshold: 50
        waitDurationInOpenState: 30000ms
        permittedNumberOfCallsInHalfOpenState: 2
  retry:
    configs:
      default: {}
    instances:
      retryForCustomerDetails:
        waitDuration: 2000ms
        max-attempts: 3
  ratelimiter:
    configs:
      default:
        registerHealthIndicator: true
    instances:
      status:
        timeoutDuration: 5000ms
        limitRefreshPeriod: 5000ms
        limitForPeriod: 1
