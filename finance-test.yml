# for test
spring:
  datasource:
    url: jdbc:h2:mem:mydb
    username: sa
    password: sa
    driverClassName: org.h2.Driver
  h2:
    console:
      enabled: true
  zipkin:
    base-url: http://localhost:9411/
  security:
    user:
      name: admin
      password: admin
eureka:
  client:
    enabled: false
    service-url:
      defaultZone: http://localhost:8071/eureka
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
