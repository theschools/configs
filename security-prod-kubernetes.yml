server:
  shutdown: graceful
spring:
  datasource:
    url: jdbc:mysql://88.222.242.187:3306/schools_security
    username: root
    password: ${DB_PASSWORD}
  flyway:
    baseline-on-migrate: true
  security:
    user:
      name: admin
      password: ${ADMIN_PASSWORD}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
eureka:
  client:
    enabled: true
    service-Url:
      defaultZone: http://88.222.242.187:30771/eureka/
    fetchRegistry: true
    registerWithEureka: true
  instance:
    preferIpAddress: true
    leaseRenewalIntervalInSeconds: 10
    leaseExpirationDurationInSeconds: 30
logging:
  level:
    org:
      springframework:
        security: DEBUG
services:
  information:
    url: http://88.222.242.187:30772/
management:
  endpoints:
    web:
      exposure:
        include: '*'
  tracing:
    export:
      enabled: false
      zipkin:
        enabled: false
        endpoint: http://88.222.242.187:30711/api/v2/spans
