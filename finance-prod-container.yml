server:
  port: 8074
  servlet:
    context-path: /finance
  shutdown: graceful
spring:
  application:
    name: finance
  datasource:
    url: jdbc:mysql://host.docker.internal:3306/schools_finance
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  kafka:
    bootstrap-servers: host.docker.internal:9092
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 20000
            logger-level: basic
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://eureka:8071/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
services:
  information:
    url: http://information:8072/
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 0.1
    export:
      enabled: true
      zipkin:
        enabled: true
        endpoint: http://zipkin:9411/api/v2/spans
        connect-timeout: 1s
        read-timeout: 5s
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
jwt:
  secret: ${JWT_SECRET}
logging:
  level:
    com.theschools.finance: INFO
